[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "once-gate"
version = "0.1.0"
description = "Make AI agent side effects happen at most once: an MCP proxy and library with a claim table."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Feenmile" }]
keywords = ["mcp", "ai-agents", "idempotency", "exactly-once", "safety"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]

[project.scripts]
oncegate = "oncegate.cli:main"

[tool.setuptools]
packages = ["oncegate"]
